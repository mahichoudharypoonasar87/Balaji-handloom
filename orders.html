<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders | Balaji Handloom</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#8B1A1A" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animation.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<header class="header" role="banner">
  <div class="container">
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html" class="nav__logo">
        <span class="nav__logo-main">🛕 Balaji Handloom</span>
        <span class="nav__logo-sub">Poonasar, Rajasthan</span>
      </a>
      <div class="nav__actions">
        <button class="nav__icon-btn theme-toggle" aria-label="Toggle dark mode">🌙</button>
        <a href="cart.html" class="nav__icon-btn" aria-label="Cart">🛒<span class="cart-badge"></span></a>
        <a href="profile.html" class="nav__icon-btn" id="nav-profile" style="display:none">👤</a>
        <a href="login.html" class="nav__icon-btn" id="nav-login">🔑</a>
        <button class="nav__icon-btn" id="nav-logout" style="display:none">🚪</button>
      </div>
    </nav>
  </div>
</header>

<main class="page-top" style="padding-bottom:var(--space-20);">
  <div class="container" style="max-width:900px;">

    <!-- List View (all orders) -->
    <div id="orders-list-view">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--space-4); margin-bottom:var(--space-8);">
        <div>
          <h1 style="font-family:var(--font-display); font-size:var(--text-4xl); font-weight:700;">My Orders 📦</h1>
          <p style="color:var(--clr-text-muted); margin-top:var(--space-2);">Track and manage all your orders</p>
        </div>
        <div class="search-wrap" style="max-width:280px;">
          <span class="search-icon">🔍</span>
          <input
            type="search"
            id="order-search"
            placeholder="Search orders…"
            aria-label="Search orders"
            style="background:var(--clr-surface); border:1.5px solid var(--clr-border);"
          />
        </div>
      </div>
      <div id="orders-list" aria-live="polite"></div>
    </div>

    <!-- Detail View (single order) -->
    <div id="order-detail" style="display:none;" aria-live="polite"></div>

  </div>
</main>

<script type="module">
  import { initOrdersPage } from "./js/order.js";
  import { initNavAuth } from "./js/auth.js";
  import { initDarkMode, initStickyHeader } from "./js/utils.js";
  initDarkMode();
  initNavAuth();
  initStickyHeader();
  initOrdersPage();
</script>
</body>
</html>
