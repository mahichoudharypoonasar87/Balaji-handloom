<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to Shree Panchmukhi Balaji Handloom" />
  <title>Login | Balaji Handloom</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#D4AF37" />
  <link rel="stylesheet" href="css/style.css?v=81fdc75" />
  <link rel="stylesheet" href="css/animation.css?v=81fdc75" />
  <link rel="stylesheet" href="css/responsive.css?v=81fdc75" />
</head>
<body>

<main class="auth-page" id="main">
  <!-- Background orbs -->
  <div class="hero-orb hero-orb--1" aria-hidden="true"></div>
  <div class="hero-orb hero-orb--2" aria-hidden="true"></div>

  <div class="auth-card page-enter" role="main">
    <!-- Logo -->
    <div class="auth-card__logo">
      <a href="index.html" aria-label="Go to home">
        <p class="auth-card__logo-text">🛕 Balaji Handloom</p>
        <p class="auth-card__subtitle">Poonasar, Rajasthan</p>
      </a>
    </div>

    <h1 class="auth-card__title">Welcome Back</h1>

    <!-- Google Login -->
    <button class="google-btn" id="google-login-btn" type="button" aria-label="Login with Google">
      <img src="assets/icons/google.svg" alt="" width="20" height="20" aria-hidden="true" />
      Continue with Google
    </button>

    <div class="divider"><span>or login with email</span></div>

    <!-- Email Login Form -->
    <form id="login-form" novalidate aria-label="Login form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input
          class="form-control"
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
          aria-required="true"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          Password
          <button
            type="button"
            id="forgot-btn"
            style="float:right; font-size:var(--text-xs); color:var(--clr-primary); background:none; border:none; cursor:pointer;"
            aria-label="Forgot password"
          >
            Forgot Password?
          </button>
        </label>
        <div style="position:relative;">
          <input
            class="form-control"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            aria-required="true"
            style="padding-right: 3rem;"
          />
          <button
            type="button"
            id="toggle-password"
            style="position:absolute; right:var(--space-3); top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1rem; color:var(--clr-text-muted);"
            aria-label="Toggle password visibility"
          >👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--md btn--full" style="margin-top:var(--space-2);">
        Login
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </p>

    <p class="auth-footer" style="margin-top:var(--space-3);">
      <a href="index.html" style="color:var(--clr-text-muted); font-size:var(--text-xs);">← Back to Store</a>
    </p>
  </div>
</main>

<script type="module">
  import { initLoginPage } from "./js/auth.js";
  import { initDarkMode } from "./js/utils.js";
  initDarkMode();
  initLoginPage();
</script>
</body>
</html>
