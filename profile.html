<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | Balaji Handloom</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#D4AF37" />
  <link rel="stylesheet" href="css/style.css?v=18b201c" />
  <link rel="stylesheet" href="css/animation.css?v=18b201c" />
  <link rel="stylesheet" href="css/responsive.css?v=18b201c" />

  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: var(--space-8);
      align-items: start;
    }
    .profile-sidebar {
      position: sticky;
      top: calc(var(--header-h) + var(--space-6));
    }
    .profile-card {
      padding: var(--space-8);
      text-align: center;
    }
    .profile-avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: var(--space-5);
    }
    .profile-avatar {
      width: 100px; height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--clr-gold);
      box-shadow: 0 0 0 4px rgba(201,149,42,0.2);
    }
    #avatar-edit-btn {
      position: absolute;
      bottom: 0; right: 0;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--clr-primary);
      color: #fff;
      font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
    }
    #avatar-edit-btn:hover { background: var(--clr-primary-dark); transform: scale(1.1); }
    .profile-name {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      margin-bottom: var(--space-1);
    }
    .profile-email { font-size: var(--text-sm); color: var(--clr-text-muted); margin-bottom: var(--space-2); }
    .profile-joined { font-size: var(--text-xs); color: var(--clr-gold); }
    .profile-nav { margin-top: var(--space-6); display: flex; flex-direction: column; gap: var(--space-1); }
    .profile-tab-btn {
      padding: var(--space-3) var(--space-4);
      text-align: left;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--clr-text-2);
      background: transparent; border: none;
      cursor: pointer; transition: all var(--transition-fast);
      display: flex; align-items: center; gap: var(--space-3);
    }
    .profile-tab-btn:hover { background: var(--clr-border); color: var(--clr-primary); }
    .profile-tab-btn.active { background: rgba(139,26,26,0.08); color: var(--clr-primary); font-weight: 600; }
    .profile-tab-panel { display: none; }
    .profile-tab-panel.active { display: block; animation: fadeInUp 0.3s ease; }
    .profile-section-title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--clr-border);
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header" role="banner">
  <div class="container">
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html" class="nav__logo">
        <span class="nav__logo-main">🛕 Balaji Handloom</span>
        <span class="nav__logo-sub">Poonasar, Rajasthan</span>
      </a>
      <div class="nav__actions">
        <button class="nav__icon-btn theme-toggle" aria-label="Toggle dark mode">🌙</button>
        <a href="profile.html#wishlist" class="nav__icon-btn" aria-label="Wishlist">♡<span class="wishlist-badge"></span></a>
        <a href="cart.html" class="nav__icon-btn" aria-label="Cart">🛒<span class="cart-badge"></span></a>
        <a href="login.html" class="nav__icon-btn" id="nav-login">🔑</a>
        <button class="nav__icon-btn" id="nav-logout" style="display:none" aria-label="Logout">🚪</button>
      </div>
    </nav>
  </div>
</header>

<main class="page-top" style="padding-bottom:var(--space-20);">
  <div class="container">

    <!-- Loading -->
    <div id="profile-loading" style="display:flex;justify-content:center;padding:var(--space-20);">
      <div class="spinner spinner--lg"></div>
    </div>

    <!-- Profile Layout -->
    <div id="profile-layout" class="profile-layout" style="display:none;">

      <!-- Sidebar -->
      <aside class="profile-sidebar">
        <div class="profile-card glass-card">
          <div class="profile-avatar-wrap">
            <img id="profile-avatar" class="profile-avatar" src="assets/images/avatar-default.webp" alt="Profile photo" width="100" height="100" />
            <button id="avatar-edit-btn" aria-label="Change profile photo" title="Change Photo">✏️</button>
            <input type="file" id="avatar-input" accept="image/*" style="display:none;" aria-hidden="true" />
          </div>
          <h1 class="profile-name" id="profile-name">Loading…</h1>
          <p class="profile-email" id="profile-email"></p>
          <p class="profile-joined" id="profile-joined"></p>

          <nav class="profile-nav" aria-label="Profile sections">
            <button class="profile-tab-btn active" data-tab="details" aria-selected="true" role="tab">
              👤 My Details
            </button>
            <button class="profile-tab-btn" data-tab="orders" aria-selected="false" role="tab">
              📦 Order History
            </button>
            <button class="profile-tab-btn" data-tab="wishlist" aria-selected="false" role="tab">
              ♡ Wishlist
            </button>
            <button class="profile-tab-btn" data-tab="password" aria-selected="false" role="tab">
              🔒 Change Password
            </button>
          </nav>

          <div id="profile-admin-link-wrap" style="display:none; margin-top:var(--space-6); padding-top:var(--space-4); border-top:1px solid var(--clr-border);">
            <a href="admin.html" class="btn btn--primary btn--sm btn--full" id="profile-admin-link" aria-label="Open Admin Panel">
              🛠️ Admin
            </a>
          </div>

          <div style="margin-top:var(--space-6); padding-top:var(--space-4); border-top:1px solid var(--clr-border);">
            <button class="btn btn--ghost btn--sm btn--full" id="profile-logout-btn" aria-label="Logout">
              🚪 Logout
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <div>

        <!-- Profile Details Tab -->
        <div class="profile-tab-panel active" id="profile-panel-details" role="tabpanel">
          <h2 class="profile-section-title">Personal Information</h2>
          <form id="profile-form" class="glass-card" style="padding:var(--space-8);" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="profile-name">Full Name</label>
                <input class="form-control" type="text" id="profile-name" placeholder="Your full name" autocomplete="name" />
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-phone">Phone Number</label>
                <input class="form-control" type="tel" id="profile-phone" placeholder="+91 XXXXX XXXXX" autocomplete="tel" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-address">Address</label>
              <textarea class="form-control" id="profile-address" rows="2" placeholder="House / Street / Area" autocomplete="street-address"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="profile-city">City</label>
                <input class="form-control" type="text" id="profile-city" placeholder="City" autocomplete="address-level2" />
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-state">State</label>
                <select class="form-control" id="profile-state" autocomplete="address-level1">
                  <option value="Rajasthan">Rajasthan</option>
                  <option value="Delhi">Delhi</option>
                  <option value="Maharashtra">Maharashtra</option>
                  <option value="Gujarat">Gujarat</option>
                  <option value="Punjab">Punjab</option>
                  <option value="Uttar Pradesh">Uttar Pradesh</option>
                  <option value="Madhya Pradesh">Madhya Pradesh</option>
                  <option value="Haryana">Haryana</option>
                  <option value="Karnataka">Karnataka</option>
                  <option value="Tamil Nadu">Tamil Nadu</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-pincode">PIN Code</label>
                <input class="form-control" type="text" id="profile-pincode" placeholder="342312" maxlength="6" autocomplete="postal-code" />
              </div>
            </div>
            <button type="submit" class="btn btn--primary btn--md">Save Changes</button>
          </form>
        </div>

        <!-- Orders Tab -->
        <div class="profile-tab-panel" id="profile-panel-orders" role="tabpanel">
          <h2 class="profile-section-title">Order History</h2>
          <div id="order-history"></div>
        </div>

        <!-- Wishlist Tab -->
        <div class="profile-tab-panel" id="profile-panel-wishlist" role="tabpanel">
          <h2 class="profile-section-title">My Wishlist</h2>
          <div class="product-grid" id="wishlist-grid"></div>
        </div>

        <!-- Password Tab -->
        <div class="profile-tab-panel" id="profile-panel-password" role="tabpanel">
          <h2 class="profile-section-title">Change Password</h2>
          <form id="password-form" class="glass-card" style="padding:var(--space-8); max-width:480px;" novalidate>
            <div class="form-group">
              <label class="form-label" for="current-password">Current Password</label>
              <input class="form-control" type="password" id="current-password" placeholder="Your current password" autocomplete="current-password" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="new-password">New Password</label>
              <input class="form-control" type="password" id="new-password" placeholder="Min 6 characters" autocomplete="new-password" required minlength="6" />
            </div>
            <div class="form-group">
              <label class="form-label" for="confirm-new-password">Confirm New Password</label>
              <input class="form-control" type="password" id="confirm-new-password" placeholder="Re-enter new password" autocomplete="new-password" required />
            </div>
            <button type="submit" class="btn btn--primary btn--md">Update Password</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</main>

<script type="module">
  import { initProfilePage } from "./js/profile.js";
  import { onAuthChange } from "./js/auth.js";
  import { initDarkMode } from "./js/utils.js";

  initDarkMode();

  // Show layout when auth resolves
  onAuthChange((user) => {
    document.getElementById("profile-loading").style.display = "none";
    if (user) {
      document.getElementById("profile-layout").style.display = "grid";
    }
  });

  initProfilePage();
</script>
</body>
</html>
